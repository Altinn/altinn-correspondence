apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: correspondence-apps
  namespace: product-correspondence
spec:
  interval: 10m
  timeout: 15m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: correspondence
      namespace: product-correspondence
  path: ./environments/at23
  prune: true
  sourceRef:
    kind: OCIRepository
    name: correspondence-manifests
  targetNamespace: product-correspondence
