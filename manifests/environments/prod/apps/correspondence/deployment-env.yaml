apiVersion: apps/v1
kind: Deployment
metadata:
  name: correspondence
spec:
  template:
    spec:
      containers:
        - name: correspondence
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: production
            - name: AzureResourceManagerOptions__SubscriptionId
              value: 09119c04-8e85-4309-8c00-32bc0ef436f0
            - name: DatabaseOptions__ConnectionString
              value: Host=altinn-corr-prod-dbserver.postgres.database.azure.com;Database=correspondence;Port=5432;Username=product-correspondence-correspondence;Ssl Mode=Require;Maximum Pool Size=25;options=-c role=azure_pg_admin;
