apiVersion: apps/v1
kind: Deployment
metadata:
  name: correspondence
spec:
  template:
    spec:
      containers:
        - name: correspondence
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: staging
            - name: AzureResourceManagerOptions__SubscriptionId
              value: 0c0eab16-7eae-4528-8971-626829e92208
            - name: DatabaseOptions__ConnectionString
              value: Host=altinn-corr-staging-dbserver.postgres.database.azure.com;Database=correspondence;Port=5432;Username=product-correspondence-correspondence;Ssl Mode=Require;Maximum Pool Size=25;options=-c role=azure_pg_admin;
