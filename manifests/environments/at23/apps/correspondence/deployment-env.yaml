              value: Host=altinn-corr-agfdt23-dbserver.postgres.database.azure.com;Database=correspondence;Port=5432;Username=product-correspondence-correspondence;Ssl Mode=Require;Maximum Pool Size=25;options=-c role=azure_pg_admin;
