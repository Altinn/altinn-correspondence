    spec:
      containers:
        - name: correspondence
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: at23
            - name: AzureResourceManagerOptions__SubscriptionId
              value: cc6b5886-36af-4d54-9d30-1b0fffc736d8
